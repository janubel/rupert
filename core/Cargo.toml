[package]
name = "rupert-core"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "macros", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
moka = { version = "0.12", default-features = false, features = ["sync"] }
argon2 = { version = "0.5", features = ["password-hash", "rand"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
ureq = { version = "3", features = ["json"] }
aes-gcm = "0.10"
hkdf = "0.12"
tokio-stream = "0.1"
hmac = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

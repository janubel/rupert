inherit_gem:
  rubocop-shopify: rubocop.yml

AllCops:
  TargetRubyVersion: 4.0
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "db/**/*"
    - "bin/**/*"
    - "test/tmp/**/*"
    - "vendor/bundle/**/*"

Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"

# Both `def self.x` and `class << self` are idiomatic; don't force a rewrite
# across the codebase.
Style/ClassMethodsDefinitions:
  Enabled: false

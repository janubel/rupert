# frozen_string_literal: true

production:
  pos_payment_reconciliation:
    class: PosPaymentReconciliationJob
    queue: default
    schedule: '*/2 * * * *'
  pos_inventory:
    class: PosInventoryJob
    queue: default
    schedule: '* * * * *'
  retention_drive:
    class: RetentionDriveJob
    queue: default
    schedule: every 15 minutes
  daily_reconciliation_archive:
    class: DailyReconciliationArchiveJob
    queue: default
    schedule: "15 7 * * * America/New_York"
  source_directories:
    class: DirectorySyncJob
    queue: default
    schedule: every 30 minutes
  square_timecards:
    class: SquareTimecardSyncJob
    queue: default
    schedule: every 15 minutes
  ctrax_timecards:
    class: CtraxLaborSyncJob
    queue: default
    schedule: '2,17,32,47 * * * *'
  ctrax_sales:
    class: CtraxSalesSyncJob
    queue: default
    schedule: '5,35 * * * *'
  iris_daily_deposits_web:
    class: IrisDailyDepositsWebJob
    queue: default
    schedule: "45 6 * * * America/New_York"
  swipesimple_web_pull:
    class: SwipesimpleWebSyncJob
    queue: default
    schedule: every 30 minutes
  ctrax_stock:
    class: CtraxStockSyncJob
    queue: default
    schedule: every 30 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  sync_tenants:
    class: SyncSchedulerJob
    queue: default
    schedule: every 15 minutes
  fulfillment_monitor:
    class: FulfillmentMonitorJob
    queue: default
    schedule: every 30 minutes
  iris_reporting:
    class: IrisReportingJob
    queue: default
    schedule: "45 6 * * * America/New_York"
  authorize_net_reporting:
    class: AuthorizeNetReportingJob
    queue: default
    schedule: every 5 minutes
  daily_store_close:
    class: OperationsBriefJob
    queue: default
    args: [daily_close]
    schedule: "55 23 * * * America/New_York"
  morning_action_brief:
    class: OperationsBriefJob
    queue: default
    args: [morning]
    schedule: "5 8 * * * America/New_York"
  weekly_business_review:
    class: OperationsBriefJob
    queue: default
    args: [weekly]
    schedule: "15 8 * * 1 America/New_York"
  money_reconciliation_daily:
    class: MoneyReconciliationJob
    queue: default
    args: [daily]
    schedule: "20 0 * * * America/New_York"
  money_reconciliation_weekly:
    class: MoneyReconciliationJob
    queue: default
    args: [weekly]
    schedule: "25 0 * * 1 America/New_York"
  money_reconciliation_monthly:
    class: MoneyReconciliationJob
    queue: default
    args: [monthly]
    schedule: "30 0 1 * * America/New_York"
  money_reconciliation_quarterly:
    class: MoneyReconciliationJob
    queue: default
    args: [quarterly]
    schedule: "35 0 1 1,4,7,10 * America/New_York"
  money_reconciliation_yearly:
    class: MoneyReconciliationJob
    queue: default
    args: [yearly]
    schedule: "40 0 1 1 * America/New_York"
  drive_backups:
    class: BackupJob
    queue: default
    schedule: every 6 hours
  ai_health_check:
    class: AiHealthCheckJob
    queue: default
    schedule: every 30 minutes
  data_retention:
    class: DataRetentionJob
    queue: default
    schedule: "40 3 * * * America/New_York"
  ask_rupert_retention:
    class: AskRupertRetentionJob
    queue: default
    schedule: "50 3 * * * America/New_York"

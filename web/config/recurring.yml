# frozen_string_literal: true

production:
  ctrax_stock:
    class: CtraxStockSyncJob
    queue: default
    schedule: every hour at minute 20
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  sync_tenants:
    class: SyncSchedulerJob
    queue: default
    schedule: every 15 minutes
  fulfillment_monitor:
    class: FulfillmentMonitorJob
    queue: default
    schedule: every 30 minutes
  daily_store_close:
    class: OperationsBriefJob
    queue: default
    args: [daily_close]
    schedule: "55 23 * * * America/New_York"
  morning_action_brief:
    class: OperationsBriefJob
    queue: default
    args: [morning]
    schedule: "5 8 * * * America/New_York"
  weekly_business_review:
    class: OperationsBriefJob
    queue: default
    args: [weekly]
    schedule: "15 8 * * 1 America/New_York"
  drive_backups:
    class: BackupJob
    queue: default
    schedule: every 6 hours
  data_retention:
    class: DataRetentionJob
    queue: default
    schedule: "40 3 * * * America/New_York"

# Cross-discipline battery (rake team_chat:battery BATTERY=cross): questions that need more than one module,
# so a bot has to call several tools and connect the answers. Graded like the others against `checks`.
questions:
  - id: x01
    cadence: cross
    module: cross
    question: Which of last month's top-selling products are low on stock right now?
    checks: [{ tool: sales_summary, args: { from: last_month.from, to: last_month.to, top_products: 10 } }]
    needs: [sales_summary:top_products[].name, sales_summary:top_products[].stock.observations[].low?, sales_summary:top_products[].stock.observations[].on_hand?, sales_summary:top_products[].stock.observations[].alert_id?]
    expect: Quotes last month's top products and uses each product's separate platform/location stock observations and low-alert IDs. Unknown stock stays unknown; no sums across locations or platforms.
  - id: x02
    cadence: cross
    module: cross
    question: Are any unshipped paid orders waiting while their products are low on stock?
    checks: [order_queues]
    needs: [order_queues:waiting_on_low_stock, order_queues:low_stock_available, order_queues:oldest_unshipped[].lines[].name, order_queues:oldest_unshipped[].lines[].low_stock?]
    expect: Gives the count of unshipped paid orders with a line matching an open low-stock alert and shows the lines/low-stock state for the oldest orders.
  - id: x03
    cadence: cross
    module: cross
    question: Compare last month's sales with last month's expenses.
    checks: [{ tool: period_review, args: { period: last_month } }]
    needs: [period_review:money_summary.gross_sales_by_currency[].gross_cents, period_review:money_summary.expenses_cents, period_review:money_summary.expenses_visible, period_review:money_summary.note]
    expect: Quotes last month's sales per currency beside the expense total. Explains the expense currency is not recorded, so they cannot be compared directly, and does not present a difference as profit.
  - id: x04
    cadence: cross
    module: cross
    question: Is anything stopping us from closing last month's books, and does any of it involve sales or payments?
    checks: [compliance_check]
    needs: [compliance_check:items[].title, compliance_check:items[].topics]
    expect: Lists the open close items and identifies which relate to sales, payments, deposits or bank lines.
  - id: x05
    cadence: cross
    module: cross
    question: How many hours did the team work last pay week, and how did sales do over the same days?
    checks: [{ tool: time_keeping_report, args: { from: last_pay_week.from, to: last_pay_week.to } }]
    needs: [time_keeping_report:totals.worked, time_keeping_report:sales_same_days.available, time_keeping_report:sales_same_days.gross_sales_by_currency[].gross_cents]
    expect: Quotes worked hours and the tool's sales for the exact same pay-week dates, per currency. Does not compute sales per hour.
  - id: x06
    cadence: cross
    module: cross
    question: Are there overdue tasks about stock or inventory counts, and is that stock still low?
    checks: [{ tool: list_tasks, args: { overdue: true, topic: stock } }, { tool: inventory_search, args: { query: tea } }]
    needs: [list_tasks:rows[].title, list_tasks:rows[].status, inventory_search:rows[].low?, inventory_search:rows[].alert_id?]
    expect: Lists overdue stock/count tasks and compares product-linked stock when the task carries an explicit sku:<SKU> label; otherwise uses inventory_search for current per-source results.
  - id: x07
    cadence: cross
    module: cross
    question: Is sync healthy enough that yesterday's sales figures can be trusted?
    checks: [sync_health, { tool: sales_summary, args: { from: yesterday.from, to: yesterday.to } }]
    needs: [sync_health:channels[].feeds, sync_health:channels[].complete_through_known, sync_health:yesterday_sync_healthy, sync_health:yesterday_complete, sales_summary:totals_by_currency[].gross_cents]
    expect: Names any failing source and says which of yesterday's figures it could affect; quotes yesterday's sales.
  - id: x08
    cadence: cross
    module: cross
    question: Which source sold the most last week, and is that source syncing correctly?
    checks: [{ tool: metric, args: { name: sales_by_source, period: last_week, compare: none } }]
    needs: [metric:values[].sources[].source, metric:values[].sources[].sync.status, metric:values[].sources[].sync.last_ok_at?]
    expect: Names the top source with its gross and share, and that source's sync status.
  - id: x09
    cadence: cross
    module: cross
    question: Give me a quick health check of the business today - sales so far, anything waiting, and any alerts.
    checks: [business_pulse]
    needs: [business_pulse:sales.gross_sales_by_currency[].gross_cents, business_pulse:sales.gross_sales_by_currency[].orders, business_pulse:waiting.queues[], business_pulse:alerts.count, business_pulse:sync.count, business_pulse:overdue_tasks.count]
    expect: Covers all three (today's sales, waiting queues, alerts) with tool figures, briefly.
  - id: x10
    cadence: cross
    module: cross
    question: Our tea shelf count is due - is there a task for it, and are any tea products low on stock?
    checks: [{ tool: list_tasks, args: { query: tea, topic: stock } }, { tool: inventory_search, args: { query: tea } }]
    needs: [list_tasks:rows[].title, list_tasks:rows[].status, inventory_search:rows[].name, inventory_search:rows[].low?, inventory_search:rows[].alert_id?]
    expect: Says whether a tea count task exists (and its status) and which tea products are low, from the tools.

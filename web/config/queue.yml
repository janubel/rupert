default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      # SQLite has one writer; default to one job thread to reduce contention
      # with web requests. PostgreSQL retains the existing three-thread default.
      threads: <%= ENV.fetch("JOB_THREADS", ENV.fetch("RUPERT_DB_ADAPTER", "postgresql") == "sqlite3" ? 1 : 3) %>
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

# SQLite is the only supported database (production, CI, development, test).
# See docs/ops/sqlite-incus.md for deployment tradeoffs and tuning.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: <%= ENV.fetch("SQLITE_BUSY_TIMEOUT_MS", 5000) %>
  journal_mode: wal
  synchronous: normal
  # One writer, many readers: keep the WAL bounded, enforce FK integrity, and
  # give the single process a useful page cache. See docs/ops/sqlite-incus.md.
  pragmas:
    foreign_keys: true
    journal_size_limit: 67108864   # 64 MB: WAL is truncated after checkpoints
    mmap_size: 134217728           # 128 MB read-only mmap of the database file
    cache_size: -20000             # ~20 MB per connection (negative = KiB)
    temp_store: memory

development:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_DEVELOPMENT", "storage/development.sqlite3") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_TEST", "storage/test.sqlite3") %>

production:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_PRODUCTION", "storage/production.sqlite3") %>

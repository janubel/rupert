# SQLite is the only supported database. Keep data on local persistent storage.
<%
requested_adapter = ENV.fetch("RUPERT_DB_ADAPTER", "sqlite3")
raise "Rupert supports SQLite only; remove RUPERT_DB_ADAPTER or set it to sqlite3" unless requested_adapter == "sqlite3"
database_url = ENV.fetch("DATABASE_URL", "")
raise "Rupert supports SQLite only; unset DATABASE_URL and use RUPERT_SQLITE_DATABASE_* paths" unless database_url.empty?
%>
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: <%= ENV.fetch("SQLITE_BUSY_TIMEOUT_MS", 5000) %>
  journal_mode: wal
  synchronous: normal
  schema_dump: schema_sqlite.rb
  pragmas:
    foreign_keys: true
    journal_size_limit: 67108864
    mmap_size: 134217728
    cache_size: -20000
    temp_store: memory

development:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_DEVELOPMENT", "storage/development.sqlite3") %>

# Tests always use a separate file, independent of the production setting.
test:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_TEST", "storage/test.sqlite3") %>

production:
  <<: *default
  database: <%= ENV.fetch("RUPERT_SQLITE_DATABASE_PRODUCTION", "storage/production.sqlite3") %>

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - rupert-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration: runs before web/jobs start, so neither service
  # races the other with db:migrate on boot. The entrypoint no longer migrates.
  migrate:
    image: ghcr.io/techmore/rupert:latest
    restart: "no"
    env_file: .env
    environment:
      RAILS_ENV: production
      RUPERT_INITIALIZE_DATABASE: ${RUPERT_INITIALIZE_DATABASE:-0}
      RUPERT_SQLITE_DATABASE_PRODUCTION: /app/storage/production.sqlite3
    command: ["bin/prepare-sqlite"]
    volumes:
      - rupert-storage:/app/storage

  web:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      RAILS_ENV: production
      RUPERT_SQLITE_DATABASE_PRODUCTION: /app/storage/production.sqlite3
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - rupert-storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  jobs:
    image: ghcr.io/techmore/rupert:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      RUPERT_SQLITE_DATABASE_PRODUCTION: /app/storage/production.sqlite3
      RAILS_LOG_TO_STDOUT: "1"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - rupert-storage:/app/storage
    command: ["bin/jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  rupert-redis:
  rupert-storage:

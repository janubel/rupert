name: Employee mobile
on:
  push:
    paths: ['mobile/**', '.github/workflows/employee-mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/employee-mobile.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Validate SDK compatibility, TypeScript and employee input boundaries
        run: npm run check
      - name: Validate Expo app configuration
        run: npx --yes expo-doctor@1.21.4
      - name: Export both native platforms with Hermes
        run: npm run export
      - name: Retain unsigned JavaScript export verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: employee-native-js-exports-${{ github.sha }}
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 14

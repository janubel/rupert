on: [push, pull_request]
name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  product_site:
    name: Product site consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 bin/build-product-site --check
      - run: python3 bin/check-doc-links
      - name: Run all browser-controller tests
        run: node --test web/test/javascript/*_test.mjs
  CI:
    name: CI (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [postgresql, sqlite3]
    # The app requires Ruby ~> 4.0, which the ruby/setup-ruby action does not
    # provide on GitHub-hosted runners (max 3.5). Run inside the official
    # ruby:4.0 image instead.
    container:
      image: ruby:4.0
    env:
      SHOPIFY_API_KEY: test-api-key
      SHOPIFY_API_SECRET: test-secret-key
      SCOPES: write_products
      HOST: app-host-name.io
      BUNDLE_GEMFILE: ${{ github.workspace }}/web/Gemfile
      RAILS_ENV: test
      RUPERT_DB_ADAPTER: ${{ matrix.adapter }}
      # Container jobs reach service containers by their label, not localhost.
      POSTGRES_HOST: postgres
      POSTGRES_USER: rupert
      POSTGRES_PASSWORD: rupert
      POSTGRES_DB: rupert_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rupert
          POSTGRES_PASSWORD: rupert
          POSTGRES_DB: rupert_test
        options: >-
          --health-cmd "pg_isready -U rupert"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop --parallel -c ./rubocop.yml

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Verify warehouse hold migration and legacy backfill
        run: bin/rails runner test/support/verify_warehouse_hold_migration.rb

      - name: Build Tailwind CSS
        run: bin/rails tailwindcss:build

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          bin/rails test 2>&1 | tee /tmp/test.log || { grep -A12 -E '^(Failure|Error):' /tmp/test.log | head -c 60000 | awk 'BEGIN{RS="--\n"} {gsub(/%/,"%25");gsub(/\r/,"%0D");gsub(/\n/,"%0A"); print "::error::" $0}'; exit 1; }

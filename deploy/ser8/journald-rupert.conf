# Install inside the `rupert` Incus container as /etc/systemd/journald.conf.d/rupert.conf, then
#   systemctl restart systemd-journald && journalctl --vacuum-size=400M
# Rupert logs to stdout (rupert-web, rupert-jobs); journald is where those lines live. These caps keep
# them for a month without letting the journal grow without bound (it had reached ~955 MB with no cap
# configured). docs/ops/logging.md explains the numbers.
[Journal]
# Survive reboots (the default "auto" only persists when /var/log/journal already exists).
Storage=persistent
# Total space the journal may use, and the free space it must leave on the disk.
SystemMaxUse=400M
SystemKeepFree=2G
# Rotate into files of at most 32 MB, or daily, so old data can be deleted a file at a time.
SystemMaxFileSize=32M
MaxFileSec=1day
# Delete anything older than 30 days even if there is room.
MaxRetentionSec=30day
Compress=yes
# A crash loop must not flood the journal: 5000 lines per 30 s per service, then journald says how many it dropped.
RateLimitIntervalSec=30s
RateLimitBurst=5000
